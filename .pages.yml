media:
  - name: site_images
    label: Site images
    input: public/images
    output: /images
    categories: [image]
    extensions: [avif, gif, jpeg, jpg, png, svg, webp]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: add {name}"
      update: "content: update {name}"
      delete: "content: remove {name}"
      rename: "content: rename {oldFilename} to {newFilename}"

content:
  - name: resources
    label: Blog posts
    type: collection
    path: src/content/resources
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, category, author, publishDate, status]
      search: [title, category, author, excerpt]
      sort: [publishDate, title, category, status]
      default:
        sort: publishDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: author
        label: Author
        type: string
        required: true
      - name: publishDate
        label: Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: Category
        type: string
        required: true
      - name: excerpt
        label: Card description
        type: text
        required: true
        description: Short summary displayed on the Resources page.
        options:
          maxlength: 240
      - name: featuredImage
        label: Featured image
        type: image
        options:
          media: site_images
          path: resources
          extensions: [avif, jpeg, jpg, png, webp]
          rename: safe
      - name: seoTitle
        label: SEO title
        type: string
        description: Optional search result title. Leave blank to use the post title.
        options:
          maxlength: 70
      - name: metaDescription
        label: Meta description
        type: text
        required: true
        options:
          maxlength: 170
      - name: socialImage
        label: Social sharing image
        type: image
        options:
          media: site_images
          path: resources
          extensions: [avif, jpeg, jpg, png, webp]
          rename: safe
      - name: status
        label: Status
        type: select
        required: true
        options:
          values:
            - name: draft
              label: Draft
            - name: published
              label: Published
      - name: body
        label: Article content
        type: rich-text
        required: true
        options:
          format: html
          media: site_images
          path: resources
          extensions: [avif, jpeg, jpg, png, webp]
          rename: safe
          switcher: true

  - name: site_settings
    label: Site and contact details
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Brand name
        type: string
        required: true
      - name: legalName
        label: Legal business name
        type: string
        required: true
      - name: email
        label: Contact email
        type: string
        required: true
      - name: phone
        label: Display phone number
        type: string
        required: true
      - name: phoneHref
        label: Telephone link
        type: string
        required: true
        description: Include the country code, for example +12168011164.
      - name: bookingUrl
        label: Booking URL
        type: string
        required: true
        description: Use the Google Calendar booking link when it is available.
      - name: description
        label: Business description
        type: text
        required: true
        options:
          maxlength: 300
      - name: social
        label: Social links
        type: object
        fields:
          - name: facebook
            label: Facebook
            type: string
          - name: instagram
            label: Instagram
            type: string
          - name: linkedin
            label: LinkedIn
            type: string
          - name: youtube
            label: YouTube
            type: string

  - name: services
    label: Services
    type: file
    path: src/data/services.json
    format: json
    list: true
    fields:
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Use lowercase letters, numbers, and hyphens only.
      - name: title
        label: Title
        type: string
        required: true
      - name: shortTitle
        label: Short title
        type: string
        required: true
      - name: summary
        label: Card summary
        type: text
        required: true
        options:
          maxlength: 240
      - name: introduction
        label: Introduction
        type: text
        required: true
      - name: uses
        label: Common uses
        type: string
        list: true
      - name: considerations
        label: Important considerations
        type: string
        list: true

  - name: faqs
    label: Frequently asked questions
    type: file
    path: src/data/faqs.json
    format: json
    list: true
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: answer
        label: Answer
        type: text
        required: true
